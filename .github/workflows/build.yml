name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up JDK. Note: Android Gradle Plugin 9+ requires Java 21.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Sets up the Gradle CLI in PATH so no binary gradle-wrapper.jar is required.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Build debug APK (auto-signed with default Android debug key, ready to install)
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # Upload the generated debug APK as an artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebVideoConverter-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
